name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build & test (unit + Keycloak integration)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and run all tests
        run: ./mvnw -B -ntp verify

      - name: Check the Docker image builds
        run: |
          KC_VERSION=$(./mvnw -q -ntp help:evaluate -Dexpression=keycloak.version -DforceStdout)
          docker build --build-arg KEYCLOAK_VERSION="$KC_VERSION" -t keycloak-configurable-theme:ci .

      - uses: actions/upload-artifact@v7
        with:
          name: keycloak-configurable-theme-jar
          path: target/keycloak-configurable-theme.jar

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            target/surefire-reports
            target/failsafe-reports
