name: Release

# Push a tag like v1.2.3 to publish:
#   git tag v1.2.3 && git push origin v1.2.3
#
# Jobs: release (tests + GitHub Release with the jar) -> docker-image and maven-central run independently,
# so a problem with one registry never blocks the others.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  release:
    name: Test and create GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      keycloak: ${{ steps.version.outputs.keycloak }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Derive versions
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          KC_VERSION=$(./mvnw -q -ntp help:evaluate -Dexpression=keycloak.version -DforceStdout)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "keycloak=$KC_VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing $VERSION for Keycloak $KC_VERSION"

      - name: Set project version
        run: ./mvnw -B -ntp versions:set -DnewVersion=${{ steps.version.outputs.version }} -DgenerateBackupPoms=false

      - name: Build and run all tests
        run: ./mvnw -B -ntp verify

      - name: Prepare release assets
        run: |
          mkdir dist
          cp target/keycloak-configurable-theme.jar "dist/keycloak-configurable-theme-${{ steps.version.outputs.version }}.jar"
          (cd dist && sha256sum ./*.jar > SHA256SUMS)

      - name: Keep the tested jar for the image job
        uses: actions/upload-artifact@v7
        with:
          name: provider-jar
          path: target/keycloak-configurable-theme.jar

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}
          body: |
            Built and tested against **Keycloak ${{ steps.version.outputs.keycloak }}**.

            **Install:** copy `keycloak-configurable-theme-${{ steps.version.outputs.version }}.jar` to `/opt/keycloak/providers/` and run `kc.sh build`.

            **Docker:** `docker pull ${{ env.IMAGE }}:${{ steps.version.outputs.version }}`

  docker-image:
    name: Publish Docker image (GHCR)
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Fetch the tested jar
        uses: actions/download-artifact@v8
        with:
          name: provider-jar
          path: target

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=${{ needs.release.outputs.version }}-kc${{ needs.release.outputs.keycloak }}
            type=raw,value=latest,enable=${{ !contains(needs.release.outputs.version, '-') }}

      - name: Build and push image (amd64 + arm64)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: KEYCLOAK_VERSION=${{ needs.release.outputs.keycloak }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  maven-central:
    name: Publish to Maven Central
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Runs only once the Central secrets are configured (see RELEASING.md).
    env:
      HAS_CENTRAL: ${{ secrets.CENTRAL_USERNAME != '' && secrets.GPG_PRIVATE_KEY != '' }}
    steps:
      - name: Skip (Central secrets not configured)
        if: env.HAS_CENTRAL != 'true'
        run: echo "::notice::Maven Central publishing skipped - add CENTRAL_USERNAME, CENTRAL_TOKEN, GPG_PRIVATE_KEY, GPG_PASSPHRASE"

      - uses: actions/checkout@v7
        if: env.HAS_CENTRAL == 'true'

      - uses: actions/setup-java@v6
        if: env.HAS_CENTRAL == 'true'
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          server-id: central
          server-username-env-var: CENTRAL_USERNAME
          server-password-env-var: CENTRAL_TOKEN
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase-env-var: MAVEN_GPG_PASSPHRASE

      - name: Deploy signed artifacts
        if: env.HAS_CENTRAL == 'true'
        run: |
          ./mvnw -B -ntp versions:set -DnewVersion=${{ needs.release.outputs.version }} -DgenerateBackupPoms=false
          ./mvnw -B -ntp -Pcentral deploy -DskipTests -DskipITs
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_TOKEN: ${{ secrets.CENTRAL_TOKEN }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
